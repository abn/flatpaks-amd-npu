name: Build Flatpak

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Dry run mode. Build and verify everything, but skip pushing to the registry and publishing the site."
        required: false
        type: boolean
        default: false
      branch:
        description: "Flatpak branch to use for build."
        required: false
        type: string
        default: "beta"
      app-id:
        description: "Rebuild only this app id."
        required: false
        type: string
        default: ""
      force-all:
        description: "Rebuild every app."
        required: false
        type: boolean
        default: false
      reconcile-only:
        description: "Reconcile index only."
        required: false
        type: boolean
        default: false
    secrets:
      gpg-private-key:
        description: "Optional GPG private key for signing flatpak repository metadata."
        required: false
    outputs:
      pages-url:
        description: "Public URL of the flatpak repository landing page."
        value: ${{ jobs.build.outputs.pages-url }}

jobs:
  build:
    name: "Build and Deploy"
    uses: aetherpak/actions/.github/workflows/publish.yml@main
    with:
      branch: ${{ inputs.branch }}
      app: ${{ inputs.app-id }}
      force-all: ${{ inputs.force-all }}
      reconcile-only: ${{ inputs.reconcile-only }}
      run-linter: true
      upload-bundle: true
      dry-run: ${{ inputs.dry-run }}
    secrets:
      gpg-private-key: ${{ secrets.gpg-private-key }}
