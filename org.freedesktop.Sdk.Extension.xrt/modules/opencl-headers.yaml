name: opencl-headers
buildsystem: simple
build-commands:
  - mkdir build && cd build && cmake -DCMAKE_INSTALL_PREFIX=$FLATPAK_DEST -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..
  - cd build && make -j${FLATPAK_BUILDER_N_JOBS:-4} install
cleanup:
  - /lib/cmake
sources:
  - type: git
    url: https://github.com/KhronosGroup/OpenCL-Headers.git
    tag: v2023.04.17
    commit: 4fdcfb0ae675f2f63a9add9552e0af62c2b4ed30
