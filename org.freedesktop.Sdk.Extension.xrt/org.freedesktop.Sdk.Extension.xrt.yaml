id: org.freedesktop.Sdk.Extension.xrt
branch: '25.08'
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
build-extension: true

build-options:
  no-debuginfo: true

cleanup:
  - '*.a'
  - '*.la'
  - /include/boost

modules:
  - modules/opencl-headers.yaml
  - modules/rapidjson.yaml
  - modules/boost.yaml
  - modules/xrt.yaml
  - name: appdata
    buildsystem: simple
    build-commands:
      - install -Dm0644 org.freedesktop.Sdk.Extension.xrt.appdata.xml -t ${FLATPAK_DEST}/share/metainfo
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.xrt.appdata.xml
